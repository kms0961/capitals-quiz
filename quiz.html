<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capitals — Field Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="button.css">
  <link rel="stylesheet" href="quiz.css">
</head>
<body>
  <main class="panel">
    <div class="masthead">
      <span id="rangeLabel">Capitals · Field Test</span>
      <span class="fig">Fig.02</span>
    </div>

    <!-- ============ START / RANGE SELECT ============ -->
    <section id="startView">
      <p class="eyebrow">Select a range</p>
      <h1 class="country" style="margin-bottom:clamp(22px,5vw,34px)">Choose your field.</h1>
      <div class="range-list" id="rangeList"></div>
    </section>

    <!-- ============ QUIZ ============ -->
    <section id="quizView" class="hidden">
      <p class="eyebrow">Name the capital of</p>
      <h1 class="country" id="country">—</h1>

      <div class="field" id="field">
        <label class="field-label" for="capital">Capital</label>
        <input
          class="capital"
          id="capital"
          type="text"
          autocomplete="off"
          autocapitalize="words"
          spellcheck="false"
          placeholder="Type your answer"
          aria-describedby="feedback">
      </div>

      <div class="instrument" id="instrument">
        <!-- travel gauge -->
        <div class="gauge" aria-hidden="true">
          <span class="rail"></span>
          <span class="tick major" style="top:6px"></span>
          <span class="label" style="top:6px">0.0</span>
          <span class="tick" style="top:40px"></span>
          <span class="tick" style="top:74px"></span>
          <span class="tick major" style="top:108px"></span>
          <span class="label" style="top:108px">7.0mm</span>
          <span class="cursor" id="cursor"></span>
        </div>

        <!-- the shared Actuator -->
        <div class="actuator">
          <button class="key" id="submitBtn" data-testid="submit-button" aria-label="Submit answer">
            <span class="lamp" aria-hidden="true"></span><span class="lbl">Submit</span>
          </button>
        </div>

        <!-- live readout -->
        <dl class="spec" aria-hidden="true">
          <dt>Question</dt><dd><span class="val" id="qNum">1</span>/<span id="qTot">0</span></dd>
          <dt>Score</dt><dd class="val" id="qScore">0</dd>
          <dt>Streak</dt><dd class="val" id="qStreak">0</dd>
        </dl>
      </div>

      <div class="readout">
        <span>Status</span>
        <span class="state" id="status" role="status" aria-live="polite">Awaiting</span>
        <span class="bar" id="bar" aria-hidden="true"></span>
      </div>

      <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
    </section>

    <!-- ============ RESULTS ============ -->
    <section id="resultsView" class="results hidden">
      <p class="eyebrow">Field test complete</p>
      <p class="score"><span id="finalScore">0</span><span class="of">/<span id="finalTot">0</span></span></p>
      <p class="grade" id="grade">—</p>

      <div class="review" id="review"></div>

      <div class="again">
        <button class="key hidden" id="retryBtn" aria-label="Retry the missed capitals">
          <span class="lamp" aria-hidden="true"></span><span class="lbl">Retry missed</span>
        </button>
        <button class="key" id="newBtn" aria-label="Start a new test">
          <span class="lamp" aria-hidden="true"></span><span class="lbl">New test</span>
        </button>
      </div>
    </section>
  </main>

    const CONTINENTS = ["Africa","Asia","Europe","North America","South America","Oceania"];

    /* ---- Elements ------------------------------------------------ */
    const instrument = document.getElementById("instrument");
    const btn    = document.getElementById("submitBtn");
    const lbl    = btn.querySelector(".lbl");
    const cursor = document.getElementById("cursor");
    const status = document.getElementById("status");
    const bar    = document.getElementById("bar");
    const field  = document.getElementById("field");
    const input  = document.getElementById("capital");
    const feedback = document.getElementById("feedback");
    const countryEl = document.getElementById("country");
    const qNum = document.getElementById("qNum"), qTot = document.getElementById("qTot");
    const qScore = document.getElementById("qScore"), qStreak = document.getElementById("qStreak");
    const rangeLabel = document.getElementById("rangeLabel");
    const rangeList = document.getElementById("rangeList");
    const startView = document.getElementById("startView");
    const quizView = document.getElementById("quizView");
    const resultsView = document.getElementById("resultsView");
    const review = document.getElementById("review");
    const retryBtn = document.getElementById("retryBtn");
    const newBtn = document.getElementById("newBtn");

    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    /* ---- Answer normalization ------------------------------------ */
    const norm = s => s.toLowerCase()
      .normalize("NFD").replace(/[̀-ͯ]/g,"")   // strip accents
      .replace(/^the\s+/,"")
      .replace(/[^a-z0-9]+/g," ").trim();

    function isCorrect(guess, q){
      const g = norm(guess);
      if(!g) return false;
      return [q.cap, ...(q.alt||[])].map(norm).includes(g);
    }

    /* ---- Start screen: build the range selector ------------------ */
    function countIn(k){ return COUNTRIES.filter(x => x.k === k).length; }

    function buildStart(){
      rangeList.innerHTML = "";
      CONTINENTS.forEach(k => rangeList.appendChild(rangeRow(k, k, countIn(k))));
      rangeList.appendChild(rangeRow("__all__", "All countries", COUNTRIES.length, true));
    }
    function rangeRow(key, name, n, all){
      const b = document.createElement("button");
      b.className = "range-row" + (all ? " all" : "");
      b.type = "button";
      b.innerHTML = `<span class="rn">${name}</span><span class="n">${n} ${n===1?"country":"countries"}</span>`;
      b.addEventListener("click", () => startRound(key, name));
      return b;
    }

    /* ---- Round state --------------------------------------------- */
    let deck = [], i = 0, score = 0, streak = 0, attempt = 1;
    let phase = "await";      // await | result
    let locked = false;       // blocks re-entry during the Armed dwell
    let missed = [];          // { c, cap } for the end-of-test review

    function shuffle(a){
      const r = a.slice();
      for(let j=r.length-1;j>0;j--){ const t=(Math.random()*(j+1))|0; [r[j],r[t]]=[r[t],r[j]]; }
      return r;
    }

    function beginRound(pool, name){
      deck = shuffle(pool);
      i = 0; score = 0; streak = 0; missed = [];
      rangeLabel.textContent = "Capitals · " + name;
      qTot.textContent = deck.length;
      startView.classList.add("hidden");
      resultsView.classList.add("hidden");
      quizView.classList.remove("hidden");
      loadQuestion();
    }

    function startRound(key, name){
      const pool = key === "__all__" ? COUNTRIES : COUNTRIES.filter(x => x.k === key);
      beginRound(pool, name);
    }

    function loadQuestion(){
      phase = "await"; attempt = 1; locked = false;
      const q = deck[i];
      countryEl.textContent = q.c;
      input.value = ""; input.disabled = false;
      feedback.textContent = "";
      instrument.classList.remove("sent","fault","pressed");
      field.classList.remove("fault","shake");
      lbl.textContent = "Submit";
      btn.setAttribute("aria-label", "Submit answer");
      status.textContent = "Awaiting";
      qNum.textContent = i + 1;
      qScore.textContent = score;
      qStreak.textContent = streak;
      setBar(i / deck.length);
      input.focus();
    }

    /* ---- Shared button mechanics (from the Actuator) ------------- */
    function setPress(down){
      instrument.classList.toggle("pressed", down);
      cursor.style.setProperty("--p", down ? 1 : 0);
    }
    function setBar(v){ bar.style.setProperty("--fill", Math.max(0, Math.min(1, v))); }

    btn.addEventListener("pointerdown", () => setPress(true));
    ["pointerup","pointerleave","pointercancel"].forEach(ev =>
      btn.addEventListener(ev, () => setPress(false)));
    btn.addEventListener("keydown", e => { if(e.key===" "||e.key==="Enter") setPress(true); });
    btn.addEventListener("keyup",   e => { if(e.key===" "||e.key==="Enter") setPress(false); });

    input.addEventListener("keydown", e => {
      if(e.key === "Enter"){ e.preventDefault(); btn.click(); }
    });
    // typing after a wrong first try clears the fault flash
    input.addEventListener("input", () => {
      if(field.classList.contains("fault")){
        field.classList.remove("fault");
        instrument.classList.remove("fault");
        if(phase === "await") status.textContent = "Awaiting";
      }
    });

    btn.addEventListener("click", () => {
      if(locked) return;
      if(phase === "await") evaluate();
      else advance();
    });

    /* ---- Evaluate an answer (2 tries per question) --------------- */
    function evaluate(){
      const guess = input.value.trim();
      if(!guess){                       // empty: nudge, don't burn a try
        field.classList.remove("shake"); void field.offsetWidth;
        if(!reduce) field.classList.add("shake");
        input.focus();
        return;
      }

      locked = true;
      input.disabled = true;
      status.textContent = "Armed";
      const q = deck[i];
      const right = isCorrect(guess, q);
      const dwell = reduce ? 0 : 420;

      window.setTimeout(() => {
        if(right)              resolveCorrect(q);
        else if(attempt === 1) resolveRetry(q);
        else                   resolveMissed(q);
      }, dwell);
    }

    function resolveCorrect(q){
      phase = "result";
      score++; streak++;
      instrument.classList.remove("fault");
      field.classList.remove("fault","shake");
      instrument.classList.add("sent");
      status.textContent = "Correct";
      feedback.innerHTML = `<span class="ok">✓ Correct</span> · <b>${q.cap}</b>`;
      finishTurn();
    }

    function resolveRetry(q){       // first wrong — one try remains, no reveal
      attempt = 2;
      streak = 0;
      instrument.classList.add("fault");
      field.classList.add("fault");
      field.classList.remove("shake"); void field.offsetWidth;
      if(!reduce) field.classList.add("shake");
      status.textContent = "Retry";
      feedback.innerHTML = `<span class="no">✗ Not quite</span> · one try left`;
      setPress(false);
      qStreak.textContent = streak;
      input.disabled = false;
      input.value = "";
      input.focus();
      locked = false;            // stay in await for the second attempt
    }

    function resolveMissed(q){      // second wrong — reveal and record
      phase = "result";
      streak = 0;
      missed.push(q);
      instrument.classList.add("fault");
      field.classList.add("fault");
      status.textContent = "Missed";
      feedback.innerHTML = `<span class="no">✗ Missed</span> · answer is <b>${q.cap}</b>`;
      finishTurn();
    }

    function finishTurn(){          // shared tail for correct + missed
      setPress(false);
      qScore.textContent = score;
      qStreak.textContent = streak;
      setBar((i + 1) / deck.length);
      lbl.textContent = (i === deck.length - 1) ? "See results →" : "Next →";
      btn.setAttribute("aria-label", lbl.textContent);
      locked = false;
      btn.focus();
    }

    function advance(){
      i++;
      if(i >= deck.length) showResults();
      else loadQuestion();
    }

    /* ---- Results ------------------------------------------------- */
    function showResults(){
      quizView.classList.add("hidden");
      resultsView.classList.remove("hidden");
      document.getElementById("finalScore").textContent = score;
      document.getElementById("finalTot").textContent = deck.length;
      const pct = Math.round(score / deck.length * 100);
      let g;
      if(pct === 100)     g = `Perfect · ${pct}% accuracy`;
      else if(pct >= 80)  g = `Sharp · ${pct}% accuracy`;
      else if(pct >= 60)  g = `Passing · ${pct}% accuracy`;
      else if(pct >= 40)  g = `Rusty · ${pct}% accuracy`;
      else                g = `Recalibrate · ${pct}% accuracy`;
      document.getElementById("grade").textContent = g;

      if(missed.length === 0){
        review.innerHTML = `<p class="review-clean">Clean run — every capital correct.</p>`;
        retryBtn.classList.add("hidden");
        newBtn.classList.remove("ghost");   // New test is the only, primary action
        newBtn.focus();
      }else{
        const rows = missed.map(m =>
          `<div class="review-row"><span class="rc">${m.c}</span><span class="ra">${m.cap}</span></div>`
        ).join("");
        review.innerHTML =
          `<p class="review-head">Missed · ${missed.length}</p>
           <div class="review-scroll">${rows}</div>`;
        retryBtn.classList.remove("hidden");
        newBtn.classList.add("ghost");       // Retry is primary, New test steps back
        retryBtn.focus();
      }
    }

    retryBtn.addEventListener("click", () => {
      if(!missed.length) return;
      beginRound(missed.slice(), "Retry missed");   // copy before beginRound resets it
    });

    newBtn.addEventListener("click", () => {
      resultsView.classList.add("hidden");
      quizView.classList.add("hidden");
      startView.classList.remove("hidden");
      rangeLabel.textContent = "Capitals · Field Test";
    });

    /* ---- Go ------------------------------------------------------ */
    buildStart();
  </script>
</body>
</html>
